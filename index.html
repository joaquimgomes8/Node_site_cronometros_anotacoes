<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
        if (sessionStorage.getItem("workspace_auth") !== "true") {
            window.location.href = "login.html";
        }
    </script>
</head>

<body>
    <div class="topbar">
        <div class="topbar-left">
            <span class="topbar-logo">⬡ Workspace</span>
            <div class="topbar-divider"></div>
            <span class="badge badge-blue" id="clock-mini">--:--:--</span>
        </div>
        <div class="topbar-right">
            <button class="btn btn-ghost btn-icon" id="btn-exportar" title="Exportar backup TXT">
                ↓ Exportar
            </button>
            <button class="btn btn-ghost btn-icon" id="btn-zen" title="Modo Foco (esconde cronômetros)">
                ⊡ Zen
            </button>
            <button class="btn btn-ghost btn-icon" id="btn-tema" title="Alternar tema">
                ◑
            </button>
        </div>
    </div>

    <div class="workspace">
        <!-- SIDEBAR: Cronômetros -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Cronômetros</span>
                <div class="sidebar-actions">
                    <button class="btn btn-ghost btn-icon" onclick="adicionarCronometroNormal()" title="Adicionar cronômetro normal">+↑</button>
                    <button class="btn btn-ghost btn-icon" onclick="adicionarCronometroRegressivo()" title="Adicionar cronômetro regressivo">+↓</button>
                </div>
            </div>
            <div class="sidebar-body" id="cronometros-container"></div>
        </div>

        <!-- PAINEL DE ANOTAÇÕES -->
        <div class="notes-panel">
            <div class="notes-header">
                <span class="notes-title">Anotações</span>
                <div class="notes-actions">
                    <button class="btn" onclick="adicionarNota()">+ Nova Nota</button>
                </div>
            </div>
            <div class="notes-body" id="notas-container"></div>
            <div class="notes-footer">
                <p>Salvo automaticamente</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
