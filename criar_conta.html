<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Workspace</title>
    <style>
        :root {
            --bg: #0d1117;
            --bg-panel: #161b22;
            --bg-input: #0d1117;
            --text: #e6edf3;
            --text-muted: #7d8590;
            --accent: #58a6ff;
            --border: #30363d;
            --danger: #f85149;
            --success: #3fb950;
            --radius: 8px;
            --font-ui: "DM Sans", Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-ui);
            padding: 16px;
        }

        .login-card {
            width: 100%;
            max-width: 360px;
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
        }

        .login-card h1 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        label {
            font-size: 13px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text);
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 10px 12px;
            border-radius: 6px;
            border: none;
            background: var(--accent);
            color: #0d1117;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-secundario {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-secundario:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .mensagem {
            margin-top: 10px;
            font-size: 13px;
            min-height: 18px;
        }

        .mensagem.erro { color: var(--danger); }
        .mensagem.sucesso { color: var(--success); }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>Criar conta</h1>
        <p>Preencha os dados abaixo para criar seu acesso ao Workspace.</p>

        <form id="form-criar-conta">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input id="usuario" name="usuario" type="text" autocomplete="username" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input id="senha" name="senha" type="password" autocomplete="new-password" required>
            </div>

            <div class="form-group">
                <label for="confirmar-senha">Confirmar senha</label>
                <input id="confirmar-senha" name="confirmar-senha" type="password" autocomplete="new-password" required>
            </div>

            <button type="submit">Criar conta</button>
            <a class="btn-secundario" href="login.html">Ja tenho conta</a>
            <p id="mensagem-conta" class="mensagem"></p>
        </form>
    </main>

    <script>
        if (sessionStorage.getItem("workspace_auth") === "true") {
            window.location.href = "index.html";
        }

        function obterContas() {
            return JSON.parse(localStorage.getItem("workspace_contas") || "[]");
        }

        document.getElementById("form-criar-conta").addEventListener("submit", (event) => {
            event.preventDefault();

            const usuario = document.getElementById("usuario").value.trim();
            const senha = document.getElementById("senha").value;
            const confirmarSenha = document.getElementById("confirmar-senha").value;
            const mensagem = document.getElementById("mensagem-conta");

            mensagem.className = "mensagem";
            mensagem.textContent = "";

            if (!usuario) {
                mensagem.className = "mensagem erro";
                mensagem.textContent = "Informe um usuario.";
                return;
            }

            if (senha.length < 4) {
                mensagem.className = "mensagem erro";
                mensagem.textContent = "A senha deve ter pelo menos 4 caracteres.";
                return;
            }

            if (senha !== confirmarSenha) {
                mensagem.className = "mensagem erro";
                mensagem.textContent = "As senhas nao coincidem.";
                return;
            }

            const contas = obterContas();
            if (contas.some((conta) => conta.usuario === usuario)) {
                mensagem.className = "mensagem erro";
                mensagem.textContent = "Este usuario ja existe.";
                return;
            }

            contas.push({ usuario, senha });
            localStorage.setItem("workspace_contas", JSON.stringify(contas));

            mensagem.className = "mensagem sucesso";
            mensagem.textContent = "Conta criada com sucesso! Redirecionando...";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1200);
        });
    </script>
</body>
</html>
